services:
  mexnat-dev-pg-db:
    image: postgres:16-alpine3.18
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.docker/pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432

  mexnat-dev-redis-db:
    image: redis:7.2.4-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - ./.docker/redis/data:/data
